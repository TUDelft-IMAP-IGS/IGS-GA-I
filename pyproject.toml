[project]
name = "igs-ga"
version = "0.1.0"
description = "IGS-GA-I: the foundational Inter-Generational Solver (Genetic Algorithm backbone) of the IMAP-IGS framework, exposing the Preferendus preference-based optimisation interface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deap>=1.4.3",
    "matplotlib>=3.10.9",
    "numpy>=2.2.5",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10.3",
    "scipy>=1.15.3",
    "notebook>=7.4.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "ruff>=0.7.3",
    "pytest>=8.3.3",
    "pytest-md>=0.2.0",
    "pytest-emoji>=0.2.0"
]

[tool.ruff]
lint.select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "C90", # mccabe, complexity,
    "S", # safety
    "A", # built-in
    "D", # docstrings
]

lint.ignore = [
    "D203", # 1 blank line required before class docstring
    "D213" # Multi-line docstring summary should start at the second line
]

[tool.ruff.lint.per-file-ignores]
"src/**/__init__.py" = ["D104", "F401"]
"src/igs_ga/optimization/modo.py" = ["B905", "E501", "D100", "D107", "C901", "D401"]
"src/igs_ga/optimization/optimization.py" = ["S101", "S311", "C901", "E501", "B905"]
"tests/**/*.py" = ["S101"]
"examples/**/*.ipynb" = ["D", "E501", "C901", "W293", "S311", "F841", "E402"]
"examples/**/*.py" = ["D", "E501", "C901", "S311", "F841", "E402", "B007", "B905", "C408", "F821"]

[tool.ruff.lint.isort]
known-third-party = ["numpy", "deap", "matplotlib", "scipy"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/igs_ga"]
